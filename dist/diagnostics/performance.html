<!doctype html><html lang="en"><meta charset="utf-8"><title>Mithila rendering check</title><style>body{margin:0;background:#eeeee6;font:14px system-ui;color:#34392d}main{display:flex;gap:24px;padding:20px}svg{width:620px;height:620px}pre{width:350px;white-space:pre-wrap}h1{font:22px Georgia}button{padding:10px}</style><main><svg id="art" xmlns="http://www.w3.org/2000/svg"></svg><section><h1>Local rendering check</h1><p id="phase">Preparing…</p><pre id="metrics"></pre><button id="vector-check">View vector export</button><textarea id="export-source" hidden></textarea></section></main><script type="module">
const params=new URLSearchParams(location.search),engine=params.get('engine')==='baseline'?'baseline':'../js',seed=params.get('seed')||'MITHILA-005',interval=Number(params.get('interval'))||100;
const {Renderer}=await import('./'+engine+'/renderer.js'),{compose}=await import('./'+engine+'/composition.js');
const model=compose(seed),svg=document.querySelector('#art'),renderer=new Renderer(svg),samples={growth:[],wind:[]},gaps={growth:[],wind:[]},longTasks=[];
try{new PerformanceObserver(entries=>longTasks.push(...entries.getEntries().map(e=>e.duration))).observe({type:'longtask',buffered:true});}catch{}
let started=performance.now();renderer.mount(model,model.settings);const mountMs=performance.now()-started;document.querySelector('#vector-check').onclick=()=>{const source=renderer.exportSVG();document.querySelector('#export-source').value=source;renderer.scene?.show(false);const vector=new DOMParser().parseFromString(source,'image/svg+xml').documentElement;vector.id='vector-proof';vector.style.width='620px';vector.style.height='620px';svg.replaceWith(vector);document.querySelector('#phase').textContent='Vector export';};started=performance.now();let previous=started,lastPaint=0,phase='growth',frames=0;
function frame(now){const elapsed=(now-started)/1000;gaps[phase].push(now-previous);previous=now;frames++;
 if(phase==='growth'&&now-lastPaint>=interval){const before=performance.now();renderer.update(Math.min(model.maturity,elapsed*model.settings.speed));samples.growth.push(performance.now()-before);lastPaint=now;}
 if(phase==='growth'&&elapsed>=model.settings.growthSeconds){renderer.update(model.maturity);phase='wind';started=now;previous=now;lastPaint=0;document.querySelector('#phase').textContent='Testing the living painting…';}
 else if(phase==='wind'&&now-lastPaint>=32){const before=performance.now();renderer.setWind(elapsed+5);samples.wind.push(performance.now()-before);lastPaint=now;}
 if(phase==='wind'&&(now-started)>=6000){const summary=arr=>({samples:arr.length,averageMs:+(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(2),p95Ms:+[...arr].sort((a,b)=>a-b)[Math.floor(arr.length*.95)].toFixed(2),maxMs:+Math.max(...arr).toFixed(2)});const result={engine,seed,interval,mountMs:+mountMs.toFixed(2),growth:summary(samples.growth),wind:summary(samples.wind),growthFrames:summary(gaps.growth),windFrames:summary(gaps.wind),longTasks:longTasks.length,canvasActive:!!renderer.scene?.active,backgroundReady:!!renderer.scene?.background,missingSprites:model.nodes.filter(n=>n.kind!=='branch').filter(n=>{const g=renderer.groups.get(n.id);return !g.parts?.length&&!g.sprite;}).map(n=>n.id+':'+n.kind),rasterSprites:svg.querySelectorAll('[data-raster-proxy]').length,domElements:svg.querySelectorAll('*').length,paths:svg.querySelectorAll('path').length};document.querySelector('#phase').textContent='Complete';document.querySelector('#metrics').textContent=JSON.stringify(result,null,2);document.body.dataset.status='complete';console.log('MITHILA_PERFORMANCE',JSON.stringify(result));return;}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></html>
